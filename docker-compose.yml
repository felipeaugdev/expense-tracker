services:
  db:
    image: mariadb:11
    container_name: expense-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: expense_tracker
      MYSQL_USER: expense_user
      MYSQL_PASSWORD: change_me
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "expense_user",
          "-pchange_me",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    container_name: expense-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mariadb://db:3306/expense_tracker
      DB_USER: expense_user
      DB_PASS: change_me
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
