server.port=${PORT:8080}

# MariaDB Connection Settings
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/expense_tracker}
spring.datasource.username=${DB_USER:expense_user}
spring.datasource.password=${DB_PASS:change_me}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}

# JPA / Hibernate Auto DDL & Logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}

#JWT Configuration
app.jwt.secret=${JWT_SECRET:ThisIsADevOnlySecretKey!}
app.jwt.expiration-ms=7776000000