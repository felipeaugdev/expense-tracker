<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <!-- Scrollbar Styles -->
    <style>
      #budgets-list,
      #budgets-modal-list {
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* old Edge */
      }
      #budgets-list::-webkit-scrollbar,
      #budgets-modal-list::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Edge */
      }

      /* Chromium Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(100, 116, 139, 0.5);
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: rgba(100, 116, 139, 0.8);
      }

      /* Firefox Custom Scrollbar */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: rgba(100, 116, 139, 0.5) transparent;
      }
    </style>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>"
    />
  </head>
  <body
    class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen p-6 transition-colors duration-200"
  >
    <div class="max-w-6xl mx-auto space-y-6">
      <!-- Header -->
      <header
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors duration-200"
      >
        <div>
          <h1
            data-i18n="title"
            class="text-2xl font-bold text-slate-900 dark:text-white"
          >
            Expense Tracker
          </h1>
          <!-- <p
            data-i18n="subtitle"
            class="text-sm text-slate-500 dark:text-slate-400"
          >
            Personal spending analytics and history
          </p> -->
        </div>

        <div class="flex items-center gap-3">
          <!-- Dark Mode Toggle Button -->
          <button
            id="theme-toggle"
            type="button"
            class="p-1.5 text-xs border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200"
            aria-label="Toggle theme"
          >
            <span id="theme-toggle-icon">🌙</span>
          </button>

          <!-- Currency Switcher -->
          <select
            id="currency-select"
            class="text-xs border border-slate-300 dark:border-slate-600 rounded-lg px-2.5 py-1.5 bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="USD">🇺🇸 USD ($)</option>
            <option value="BRL">🇧🇷 BRL (R$)</option>
          </select>

          <!-- Language Switcher -->
          <select
            id="language-select"
            class="text-xs border border-slate-300 dark:border-slate-600 rounded-lg px-2.5 py-1.5 bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="en">English (US)</option>
            <option value="pt">Português (Brasil)</option>
          </select>

          <!-- Auth Button -->
          <button
            id="auth-button"
            type="button"
            class="text-xs font-medium px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white transition duration-200"
          >
            Log In / Register
          </button>

          <span
            data-i18n="apiConnected"
            class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 dark:bg-emerald-900/50 text-emerald-800 dark:text-emerald-300"
            >API Connected</span
          >
        </div>
      </header>

      <!-- Analytics Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
        <!-- Current Month -->
        <div
          class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors duration-200 min-h-[7.5rem] flex flex-col justify-center"
        >
          <h2
            data-i18n="currentMonth"
            class="text-xs font-semibold text-slate-400 dark:text-slate-400 uppercase tracking-wider"
          >
            Current Month
          </h2>
          <p
            id="current-month-total"
            class="text-3xl font-extrabold text-slate-900 dark:text-white mt-2"
          >
            $0.00
          </p>
        </div>

        <!-- Previous Month -->
        <div
          class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors duration-200 min-h-[7.5rem] flex flex-col justify-center"
        >
          <h2
            data-i18n="previousMonth"
            class="text-xs font-semibold text-slate-400 dark:text-slate-400 uppercase tracking-wider"
          >
            Previous Month
          </h2>
          <p
            id="previous-month-total"
            class="text-3xl font-extrabold text-slate-900 dark:text-white mt-2"
          >
            $0.00
          </p>
        </div>

        <!-- vs. Last Month -->
        <div
          class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors duration-200 min-h-[7.5rem] flex flex-col justify-center"
        >
          <h2
            data-i18n="vsLastMonth"
            class="text-xs font-semibold text-slate-400 dark:text-slate-400 uppercase tracking-wider"
          >
            vs. Last Month
          </h2>
          <p
            id="month-variance"
            class="text-3xl font-extrabold text-slate-900 dark:text-white mt-2"
          >
            0%
          </p>
        </div>

        <!-- Budgets this month -->
        <div
          class="bg-white dark:bg-slate-800 p-2.5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col transition-colors duration-200 min-h-[8.4rem] max-h-[8.4rem]"
        >
          <!-- Header Row -->
          <div class="flex justify-between items-center mb-2 h-4">
            <div class="flex items-center gap-1.5">
              <h2
                class="text-xs font-semibold text-slate-400 dark:text-slate-400 uppercase tracking-wider leading-none"
              >
                Budgets
              </h2>
              <span
                id="budgets-warning"
                class="hidden text-sm leading-none cursor-default"
                title=""
                >⚠️</span
              >
            </div>
            <button
              id="edit-budgets-btn"
              type="button"
              class="text-xs text-indigo-600 hover:text-indigo-800 dark:text-indigo-400 dark:hover:text-indigo-300 font-medium leading-none"
            >
              + Set / Edit
            </button>
          </div>

          <!-- Budgets List -->
          <div
            id="budgets-list"
            class="flex-1 overflow-y-auto max-h-28 space-y-2 text-sm pr-1"
          >
            <!-- Sample List -->
            <!-- <div class="flex flex-col gap-0.5">
              <div class="flex justify-between text-xs">
                <span class="font-medium text-slate-700 dark:text-slate-300"
                  >Food</span
                >
                <span class="text-slate-500 dark:text-slate-400"
                  >$420 / $800</span
                >
              </div>
              <div
                class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-1.5"
              >
                <div
                  class="bg-emerald-500 h-1.5 rounded-full"
                  style="width: 52%"
                ></div>
              </div>
            </div> -->

            <!-- Empty State -->
            <p
              id="budgets-empty"
              class="text-xs text-slate-400 dark:text-slate-500 text-center py-4"
            >
              No budgets set yet
            </p>
          </div>
        </div>
      </div>

      <!-- Main Content Grid -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        <!-- Left Column: Add Expense Form -->
        <div
          class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors duration-200"
        >
          <h2
            data-i18n="addExpense"
            class="text-lg font-bold text-slate-900 dark:text-white mb-4"
          >
            Add Expense
          </h2>
          <form id="expense-form" class="space-y-4">
            <div>
              <label
                data-i18n="amountLabel"
                class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
                >Amount</label
              >
              <input
                type="text"
                id="amount"
                required
                inputmode="decimal"
                placeholder="0.00"
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <div>
              <label
                data-i18n="categoryLabel"
                class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
                >Category</label
              >
              <select
                id="category"
                required
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
              >
                <option value="FOOD">Food</option>
                <option value="TRANSPORTATION">Transportation</option>
                <option value="UTILITIES">Utilities</option>
                <option value="HOUSING">Housing</option>
                <option value="ENTERTAINMENT">Entertainment</option>
                <option value="HEALTHCARE">Healthcare</option>
                <option value="SHOPPING">Shopping</option>
                <option value="OTHER">Other</option>
              </select>

              <button
                type="button"
                id="show-new-category"
                class="mt-1 text-xs text-indigo-600 hover:text-indigo-800 dark:text-indigo-400 dark:hover:text-indigo-300"
              >
                + New category
              </button>

              <div
                id="new-category-form"
                class="hidden mt-2 flex gap-2 items-center"
              >
                <input
                  type="text"
                  id="new-category-name"
                  placeholder="e.g. Gym"
                  maxlength="50"
                  class="flex-1 px-3 py-1.5 text-sm border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
                <button
                  type="button"
                  id="add-category-btn"
                  class="px-3 py-1.5 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg"
                >
                  Add
                </button>
                <button
                  type="button"
                  id="cancel-new-category"
                  class="text-xs text-slate-500 hover:text-slate-700 dark:text-slate-400"
                >
                  Cancel
                </button>
              </div>
            </div>
            <div>
              <label
                data-i18n="descriptionLabel"
                class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
                >Description</label
              >
              <input
                type="text"
                id="description"
                required
                placeholder="e.g. Groceries"
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <button
              type="submit"
              data-i18n="saveExpense"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200"
            >
              Save Expense
            </button>
          </form>
        </div>

        <!-- Right Column: Chart and Table -->
        <div class="lg:col-span-2 space-y-6">
          <!-- Category Chart -->
          <div
            class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors duration-200"
          >
            <h2
              data-i18n="spendingByCategory"
              class="text-lg font-bold text-slate-900 dark:text-white mb-4"
            >
              Spending by Category
            </h2>
            <div class="max-h-60 flex justify-center">
              <canvas id="category-chart"></canvas>
            </div>
          </div>

          <!-- Transactions Table -->
          <div
            class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors duration-200"
          >
            <div class="flex justify-between items-center mb-4">
              <h2
                data-i18n="recentTransactions"
                class="text-lg font-bold text-slate-900 dark:text-white"
              >
                Recent Transactions
              </h2>
              <select
                id="filter-days"
                class="text-sm border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg px-2 py-1"
              >
                <option value="" data-i18n="filterAllTime">All Time</option>
                <option value="7" data-i18n="filter7Days">Last 7 Days</option>
                <option value="14" data-i18n="filter14Days">
                  Last 14 Days
                </option>
                <option value="30" data-i18n="filter30Days">
                  Last 30 Days
                </option>
              </select>
            </div>
            <div
              class="overflow-x-auto max-h-72 overflow-y-auto custom-scrollbar"
            >
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr
                    class="border-b border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-400 dark:text-slate-400 uppercase"
                  >
                    <th class="py-2" data-i18n="thDate">Date</th>
                    <th class="py-2" data-i18n="thDescription">Description</th>
                    <th class="py-2" data-i18n="thCategory">Category</th>
                    <th class="py-2 text-right" data-i18n="thAmount">Amount</th>
                    <th class="py-2 text-center" data-i18n="thAction">
                      Action
                    </th>
                  </tr>
                </thead>
                <tbody
                  id="expense-table-body"
                  class="divide-y divide-slate-100 dark:divide-slate-700/60 text-sm"
                >
                  <!-- Rows (JS) -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Auth Modal -->
    <div
      id="auth-modal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50"
    >
      <div
        class="bg-white dark:bg-slate-800 rounded-xl shadow-xl w-full max-w-md mx-4 p-6 border border-slate-200 dark:border-slate-700"
      >
        <div class="flex justify-between items-center mb-5">
          <h2
            id="auth-modal-title"
            class="text-xl font-bold text-slate-900 dark:text-white"
          >
            Log In
          </h2>
          <button
            id="auth-modal-close"
            type="button"
            class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-2xl leading-none"
          >
            &times;
          </button>
        </div>

        <!-- Tabs -->
        <div class="flex mb-5 border-b border-slate-200 dark:border-slate-700">
          <button
            id="tab-login"
            type="button"
            data-i18n="login"
            class="flex-1 py-2 text-sm font-medium text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 dark:border-indigo-400"
          >
            Log In
          </button>
          <button
            id="tab-register"
            type="button"
            data-i18n="register"
            class="flex-1 py-2 text-sm font-medium text-slate-500 dark:text-slate-400"
          >
            Register
          </button>
        </div>

        <!-- Form -->
        <form id="auth-form" class="space-y-4">
          <div>
            <label
              class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
              data-i18n="usernameLabel"
              >Username</label
            >
            <input
              type="text"
              id="auth-username"
              required
              class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div>
            <label
              class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
              data-i18n="passwordLabel"
              >Password</label
            >
            <input
              type="password"
              id="auth-password"
              required
              minlength="6"
              class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <p
            id="auth-error"
            class="text-sm text-rose-600 dark:text-rose-400 hidden"
          ></p>

          <button
            type="submit"
            id="auth-submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200"
          >
            Log In
          </button>
        </form>
      </div>
    </div>

    <!-- Edit Expense Modal -->
    <div
      id="edit-modal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50"
    >
      <div
        class="bg-white dark:bg-slate-800 rounded-xl shadow-xl w-full max-w-md mx-4 p-6 border border-slate-200 dark:border-slate-700"
      >
        <div class="flex justify-between items-center mb-5">
          <h2 class="text-xl font-bold text-slate-900 dark:text-white">
            Edit Expense
          </h2>
          <button
            id="edit-modal-close"
            type="button"
            class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-2xl leading-none"
          >
            &times;
          </button>
        </div>

        <form id="edit-form" class="space-y-4">
          <input type="hidden" id="edit-id" />

          <div>
            <label
              class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
            >
              Amount
            </label>
            <input
              type="text"
              id="edit-amount"
              required
              inputmode="decimal"
              class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label
              class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
            >
              Category
            </label>
            <select
              id="edit-category"
              required
              class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="FOOD">Food</option>
              <option value="TRANSPORTATION">Transportation</option>
              <option value="UTILITIES">Utilities</option>
              <option value="HOUSING">Housing</option>
              <option value="ENTERTAINMENT">Entertainment</option>
              <option value="HEALTHCARE">Healthcare</option>
              <option value="SHOPPING">Shopping</option>
              <option value="OTHER">Other</option>
            </select>
          </div>

          <div>
            <label
              class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
            >
              Description
            </label>
            <input
              type="text"
              id="edit-description"
              required
              class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label
              class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
            >
              Date
            </label>
            <input
              type="date"
              id="edit-date"
              required
              class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200"
          >
            Save Changes
          </button>
        </form>
      </div>
    </div>

    <!-- Manage Budgets Modal -->
    <div
      id="budgets-modal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50"
    >
      <div
        class="bg-white dark:bg-slate-800 rounded-xl shadow-xl w-full max-w-md mx-4 p-6 border border-slate-200 dark:border-slate-700"
      >
        <div class="flex justify-between items-center mb-5">
          <h2 class="text-xl font-bold text-slate-900 dark:text-white">
            Manage Budgets
          </h2>
          <button
            id="budgets-modal-close"
            type="button"
            class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-2xl leading-none"
          >
            &times;
          </button>
        </div>

        <!-- Existing budgets list -->
        <div
          id="budgets-modal-list"
          class="space-y-3 mb-6 max-h-48 overflow-y-auto"
        >
          <!-- Filled by JS -->
        </div>

        <div class="border-t border-slate-200 dark:border-slate-700 pt-4">
          <h3
            class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3"
          >
            Add new budget
          </h3>

          <div class="space-y-3">
            <div>
              <label
                class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
              >
                Category
              </label>
              <select
                id="budget-category"
                class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
              >
                <!-- Filled by JS -->
              </select>
            </div>

            <div>
              <label
                class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
              >
                Monthly Limit
              </label>
              <input
                type="text"
                id="budget-amount"
                inputmode="decimal"
                placeholder="0.00"
                class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>

            <button
              type="button"
